# ============================================================
# Configuracion de SonarCloud
# Reemplaza los valores TU_... con los que te muestra SonarCloud
# ============================================================
sonar.organization=TU_ORGANIZACION
sonar.projectKey=TU_ORGANIZACION_TU_REPOSITORIO
sonar.projectName=mlops-prediccion-pago-creditos

# Codigo fuente que se analiza (sin las pruebas ni los notebooks)
sonar.sources=mlops_pipeline
sonar.exclusions=mlops_pipeline/test_*.py,**/*.ipynb

# Pruebas
sonar.tests=mlops_pipeline
sonar.test.inclusions=mlops_pipeline/test_*.py

# Python y cobertura (el archivo coverage.xml lo genera pytest --cov-report=xml)
sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml

sonar.sourceEncoding=UTF-8
