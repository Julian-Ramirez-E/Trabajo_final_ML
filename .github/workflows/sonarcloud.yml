# Ejecuta las pruebas y envia calidad, seguridad y cobertura a SonarCloud
# cada vez que se hace push a una de las 3 ramas o se abre un Pull Request.
name: SonarCloud

on:
  push:
    branches: [developer, certification, master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:        # permite ejecutarlo a mano desde la pestaña Actions (boton "Run workflow")

permissions:
  contents: read
  pull-requests: read

jobs:
  analisis:
    name: Pruebas y analisis
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0          # historial completo (SonarCloud lo necesita)

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pruebas con cobertura
        run: pytest mlops_pipeline --cov --cov-report=xml

      - name: Cache de paquetes de Sonar
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Analisis de SonarCloud
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # lo entrega GitHub solo (info de Pull Requests)
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}     # el que creas tu en Settings > Secrets
